services:
  - type: web
    name: supplychain-sentinel
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install --no-cache-dir --retries 10 --timeout 120 -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /health
